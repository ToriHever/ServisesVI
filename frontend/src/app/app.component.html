<div class="shell" [class.collapsed]="collapsed()">
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="brand" *ngIf="!collapsed()">{{ title }}</span>
      <button
        pButton
        type="button"
        class="toggle-btn"
        [icon]="collapsed() ? 'pi pi-angle-right' : 'pi pi-angle-left'"
        severity="secondary"
        [text]="true"
        (click)="toggle()"
      ></button>
    </div>

    <nav class="sidebar-nav">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        pTooltip="Главная"
        tooltipPosition="right"
        [tooltipDisabled]="!collapsed()"
      >
        <i class="pi pi-home"></i>
        <span *ngIf="!collapsed()">Главная</span>
      </a>

      <div class="nav-section" *ngIf="favorites().length > 0">
        <span class="nav-section-title" *ngIf="!collapsed()">Избранное</span>
        <a
          *ngFor="let script of favorites()"
          [routerLink]="['/scripts', script.id, 'run']"
          routerLinkActive="active"
          pTooltip="{{ script.label }}"
          tooltipPosition="right"
          [tooltipDisabled]="!collapsed()"
        >
          <i class="pi pi-star-fill"></i>
          <span *ngIf="!collapsed()">{{ script.label }}</span>
        </a>
      </div>

      <div class="nav-section" *ngFor="let group of groups()">
        <span class="nav-section-title" *ngIf="!collapsed()">{{ group.title }}</span>
        <a
          *ngFor="let script of group.scripts"
          [routerLink]="['/scripts', script.id, 'run']"
          routerLinkActive="active"
          pTooltip="{{ script.label }}"
          tooltipPosition="right"
          [tooltipDisabled]="!collapsed()"
        >
          <i class="pi pi-circle-fill"></i>
          <span *ngIf="!collapsed()">{{ script.label }}</span>
        </a>
      </div>

      <div class="nav-section">
        <span class="nav-section-title" *ngIf="!collapsed()">Все данные</span>
        <a
          routerLink="/scripts"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          pTooltip="Все скрипты"
          tooltipPosition="right"
          [tooltipDisabled]="!collapsed()"
        >
          <i class="pi pi-th-large"></i>
          <span *ngIf="!collapsed()">Все скрипты</span>
        </a>
        <a
          routerLink="/history"
          routerLinkActive="active"
          pTooltip="История"
          tooltipPosition="right"
          [tooltipDisabled]="!collapsed()"
        >
          <i class="pi pi-history"></i>
          <span *ngIf="!collapsed()">История</span>
        </a>
        <a
          routerLink="/cookies"
          routerLinkActive="active"
          pTooltip="Cookies"
          tooltipPosition="right"
          [tooltipDisabled]="!collapsed()"
        >
          <i class="pi pi-key"></i>
          <span *ngIf="!collapsed()">Cookies</span>
        </a>
      </div>
    </nav>
  </aside>

  <div class="content-area">
    <router-outlet></router-outlet>
  </div>
</div>
