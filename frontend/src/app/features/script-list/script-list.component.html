<div class="page">
  <h1>Скрипты</h1>

  <p-table [value]="scripts()" [loading]="loading()" dataKey="id">
    <ng-template pTemplate="header">
      <tr>
        <th>Название</th>
        <th>Описание</th>
        <th>Особенности</th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-script>
      <tr>
        <td>{{ script.name }}</td>
        <td>{{ script.description }}</td>
        <td>
          <p-tag *ngIf="!script.execution.headless" value="видимый браузер" severity="warn" class="mr-1" />
          <p-tag *ngFor="let b of script.execution.blocking" [value]="b" severity="danger" class="mr-1" />
          <p-tag *ngIf="script.execution.blocking.length === 0 && script.execution.headless" value="автоматический" severity="success" />
        </td>
        <td>
          <a [routerLink]="['/scripts', script.id, 'run']">
            <button pButton type="button" label="Запустить" icon="pi pi-play"></button>
          </a>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
